# Production : image publiee par GitHub Actions (.github/workflows/api-image.yml)
# a chaque push sur main. Elle embarque l'API, les workflows et le site.
#
#   cp .env.example .env                    (puis remplir)
#   docker compose pull && docker compose up -d
#   docker compose run --rm api npm run import   (import initial depuis Grist)
#
# Mettre a jour apres un push sur main : docker compose pull && docker compose up -d
services:
  api:
    # API_TAG=sha-abc1234 dans .env pour figer (ou revenir a) une version precise.
    image: ghcr.io/2gether-asso/2gatcha-api:${API_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      # Optionnel, si le depot est clone sur le serveur : servir le site et les
      # workflows du depot plutot que ceux de l'image (un `git pull` suffit
      # alors pour le site, `docker compose restart` pour les workflows).
      # dev-login n'est jamais servi.
      # - ../site:/app/site:ro
      # - ../n8n/workflows:/app/workflows:ro
