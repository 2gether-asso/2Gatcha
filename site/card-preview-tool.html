<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prévisualisation de carte - 2Gatcha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%238b5cf6%27/%3E%3Cstop offset=%271%27 stop-color=%27%2322d3ee%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27sans-serif%27 font-weight=%27800%27 font-size=%2730%27 fill=%27white%27 text-anchor=%27middle%27%3E2G%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <header id="site-header"></header>

  <main id="main-content">
    <div class="panel">
      <h1>Prévisualisation de carte</h1>
      <p class="lead">
        Outil local (rien n'est envoye a Grist ni a n8n) pour verifier le rendu
        d'une illustration dans le gabarit reel d'une carte avant de l'uploader.
      </p>

      <div class="preview-tool-layout">
        <form class="preview-tool-form" id="preview-form">
          <label>
            Image de la carte
            <input type="file" id="pt-image" accept="image/*" />
          </label>
          <label>
            Nom de la carte
            <input type="text" id="pt-name" placeholder="ex: Le Chat Cosmique" value="Nom de la carte" />
          </label>
          <label>
            Artiste
            <input type="text" id="pt-artist" placeholder="ex: Jules D." value="Artiste" />
          </label>
          <label>
            Rareté
            <select id="pt-rarity">
              <option value="commune" data-color="#9aa0b4">Commune</option>
              <option value="rare" data-color="#3b82f6">Rare</option>
              <option value="epique" data-color="#a855f7">Épique</option>
              <option value="legendaire" data-color="#f5a524" selected>Légendaire</option>
            </select>
          </label>
        </form>

        <div class="preview-tool-stage">
          <div class="card" style="opacity:1;transform:none;animation:none;">
            <div class="card-inner" style="transform:rotateY(180deg);">
              <div class="card-face card-back"><span>?</span></div>
              <div class="card-face card-front">
                <img id="pt-preview-img" src="" alt="" />
                <div class="card-info">
                  <div class="card-name" id="pt-preview-name">Nom de la carte</div>
                  <div class="card-artist" id="pt-preview-artist">Artiste</div>
                  <span class="rarity-badge" id="pt-preview-rarity">Légendaire</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    const imgInput = document.getElementById("pt-image");
    const nameInput = document.getElementById("pt-name");
    const artistInput = document.getElementById("pt-artist");
    const raritySelect = document.getElementById("pt-rarity");
    const previewImg = document.getElementById("pt-preview-img");
    const previewName = document.getElementById("pt-preview-name");
    const previewArtist = document.getElementById("pt-preview-artist");
    const previewRarity = document.getElementById("pt-preview-rarity");

    function updatePreview() {
      previewName.textContent = nameInput.value || "Nom de la carte";
      previewArtist.textContent = artistInput.value || "";
      const opt = raritySelect.selectedOptions[0];
      const color = opt.dataset.color;
      previewRarity.textContent = opt.textContent;
      previewRarity.style.background = color + "22";
      previewRarity.style.color = rarityTextColor(color);
      previewRarity.style.border = `1px solid ${color}`;
      const cardFace = document.querySelector(".preview-tool-stage .card-face.card-front");
      cardFace.style.boxShadow = `0 0 30px ${color}55`;
    }

    imgInput.addEventListener("change", () => {
      const file = imgInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => { previewImg.src = e.target.result; };
      reader.readAsDataURL(file);
    });
    [nameInput, artistInput, raritySelect].forEach((el) => el.addEventListener("input", updatePreview));
    updatePreview();
  </script>
</body>
</html>
