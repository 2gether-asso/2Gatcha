<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma collection - 2Gatcha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%238b5cf6%27/%3E%3Cstop offset=%271%27 stop-color=%27%2322d3ee%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27sans-serif%27 font-weight=%27800%27 font-size=%2730%27 fill=%27white%27 text-anchor=%27middle%27%3E2G%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <header id="site-header"></header>

  <main id="main-content">
    <div class="panel">
      <h1>Ma collection</h1>

      <div id="guest-warning" style="display:none;">
        <p>Tu dois d'abord te <a href="index.html">connecter avec Discord</a>.</p>
      </div>

      <div id="loading-zone" class="collection-grid" style="display:none;">
        <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
        <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
      </div>

      <div id="collection-zone" style="display:none;">
        <div id="stats-block">
          <p class="lead" id="progress-label"></p>
          <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>

          <div id="rarity-progress" class="rarity-progress-list"></div>
          <div id="stats-grid" class="stats-grid"></div>
          <div id="milestone-banner" class="milestone-banner" style="display:none;"></div>
        </div>

        <div class="filters" id="rarity-filters"></div>
        <div class="collection-toolbar">
          <input type="text" id="search-input" placeholder="Rechercher une carte..." autocomplete="off" aria-label="Rechercher une carte dans la collection" />
          <select id="sort-select">
            <option value="extension">Trier : par extension</option>
            <option value="name">Trier : alphabetique</option>
            <option value="artist">Trier : par artiste</option>
            <option value="recent">Trier : recemment obtenues</option>
          </select>
          <select id="artist-filter">
            <option value="">Tous les artistes</option>
          </select>
          <button type="button" class="btn-secondary" id="missing-toggle">&#128269; Manquantes uniquement</button>
          <button type="button" class="btn-secondary" id="favorites-toggle">&#9733; Favoris uniquement</button>
          <button type="button" class="btn-secondary" id="mark-seen-btn">&#10003; Tout marquer comme vu</button>
          <button type="button" class="btn-secondary" id="dense-toggle" title="Grille compacte : plus de cartes visibles a l'ecran">&#9638; Grille compacte</button>
          <button type="button" class="btn-secondary" id="cinema-toggle" title="Plein ecran : masque le menu et les stats pour ne garder que les cartes">&#128065; Plein écran</button>
          <button type="button" class="btn-secondary" id="stats-toggle" title="Masquer le bandeau de stats pour gagner de la place">&#128202; Masquer les stats</button>
          <button type="button" class="btn-ghost" id="reset-filters-btn">Réinitialiser</button>
        </div>

        <div class="binder-accent-row" id="binder-accent-row" title="Personnalise la couleur d'accent de ton classeur">
          <span class="binder-accent-label">Classeur :</span>
          <button type="button" class="binder-swatch active" data-accent="" style="--swatch-color:#8b5cf6;" aria-label="Accent violet (défaut)"></button>
          <button type="button" class="binder-swatch" data-accent="#22d3ee" style="--swatch-color:#22d3ee;" aria-label="Accent cyan"></button>
          <button type="button" class="binder-swatch" data-accent="#f472b6" style="--swatch-color:#f472b6;" aria-label="Accent rose"></button>
          <button type="button" class="binder-swatch" data-accent="#4ade80" style="--swatch-color:#4ade80;" aria-label="Accent vert"></button>
          <button type="button" class="binder-swatch" data-accent="#f5a524" style="--swatch-color:#f5a524;" aria-label="Accent doré"></button>
        </div>

        <div class="sleeve-row" id="sleeve-row" title="Pochettes de cartes : débloquées en montant de niveau">
          <span class="binder-accent-label">Pochettes :</span>
          <button type="button" class="sleeve-swatch active" data-sleeve="" data-level="1">Défaut</button>
          <button type="button" class="sleeve-swatch" data-sleeve="neon" data-level="4">Néon</button>
          <button type="button" class="sleeve-swatch" data-sleeve="vintage" data-level="6">Vintage</button>
          <button type="button" class="sleeve-swatch" data-sleeve="carbone" data-level="10">Carbone</button>
        </div>

        <div id="collection-grid"></div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/collection.js"></script>
</body>
</html>
