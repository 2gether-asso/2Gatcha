<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne - 2Gatcha</title>
  <!-- Page servie par sw.js quand le reseau est coupe et que la page demandee
       n'est pas en cache : styles en ligne (aucun fichier externe a charger). -->
  <style>
    :root { color-scheme: dark; --bg: #06070f; --panel: #14162e; --text: #f5f5fc; --dim: #9a9cc4; --accent: #8b5cf6; --accent-2: #22d3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font: 15px/1.55 "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text); background: radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.25), transparent 50%), radial-gradient(circle at 85% 90%, rgba(34, 211, 238, 0.18), transparent 50%), var(--bg); }
    main { width: min(440px, 100%); padding: 28px 24px; text-align: center; border-radius: 18px; background: var(--panel); border: 1px solid rgba(139, 92, 246, 0.3); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.9); }
    .icon { font-size: 3rem; line-height: 1; }
    h1 { margin: 12px 0 6px; font-size: 1.4rem; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { margin: 0 0 18px; color: var(--dim); }
    button { font: inherit; font-weight: 700; padding: 10px 22px; border: 0; border-radius: 999px; color: #fff; background: linear-gradient(135deg, var(--accent), #6d28d9); cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
    small { display: block; margin-top: 14px; color: var(--dim); }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">&#128225;</div>
    <h1>Pas de connexion</h1>
    <p>2Gatcha a besoin d'internet pour tirer tes cartes. Les pages déjà visitées restent consultables.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <small>La page se recharge toute seule dès que la connexion revient.</small>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
