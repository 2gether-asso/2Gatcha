<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouvrir un booster - 2Gatcha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%238b5cf6%27/%3E%3Cstop offset=%271%27 stop-color=%27%2322d3ee%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27sans-serif%27 font-weight=%27800%27 font-size=%2730%27 fill=%27white%27 text-anchor=%27middle%27%3E2G%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="burst-flash" class="burst-flash"></div>
  <div id="legendary-flash" class="legendary-flash"></div>
  <header id="site-header"></header>

  <main>
    <div class="panel">
      <h1>Ouverture de booster</h1>
      <p class="lead">Un booster contient 5 cartes. Les boosters s'obtiennent uniquement en réclamant un code d'événement. Tape sur un pack pour l'ouvrir.</p>

      <div id="guest-warning" style="display:none;">
        <p>Tu dois d'abord te <a href="index.html">connecter avec Discord</a>.</p>
      </div>

      <div id="booster-zone" style="display:none;">
        <p id="booster-count-label" class="stock-label" style="margin-bottom:16px;"></p>
        <div class="extension-picker" id="extension-picker"></div>
      </div>
    </div>
  </main>

  <!-- Modal plein écran : ouverture + reveal, par-dessus toute la page -->
  <div id="pack-modal-overlay" class="pack-modal-overlay" hidden>
    <button id="pack-modal-close" class="card-modal-close pack-modal-close" aria-label="Fermer">&times;</button>
    <div class="pack-modal-stage">
      <div class="quantity-picker" id="quantity-picker">
        <button type="button" class="btn-secondary active" data-qty="1">Ouvrir x1</button>
        <button type="button" class="btn-secondary" data-qty="5">Ouvrir x5</button>
      </div>

      <div class="booster-stage">
        <div id="booster-pack" class="booster-pack">
          <div class="booster-emoji">&#127183;</div>
          <div class="booster-title">Booster</div>
          <div class="booster-sub">5 cartes</div>
        </div>
        <div id="skip-hint" class="skip-hint">Tape pour accelerer</div>
      </div>

      <div id="booster-hint" class="booster-hint"></div>

      <div id="reveal-grid" class="reveal-grid hearthstone stacked"></div>
      <div id="stack-progress" class="stack-progress"></div>
      <button type="button" id="share-pull-btn" class="btn-secondary" style="display:none;">&#128247; Partager ce pull</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/opening.js"></script>
</body>
</html>
