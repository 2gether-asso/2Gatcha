<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réclamer un code - 2Gatcha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%238b5cf6%27/%3E%3Cstop offset=%271%27 stop-color=%27%2322d3ee%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27sans-serif%27 font-weight=%27800%27 font-size=%2730%27 fill=%27white%27 text-anchor=%27middle%27%3E2G%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="burst-flash" class="burst-flash"></div>
  <div id="legendary-flash" class="legendary-flash"></div>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <header id="site-header"></header>

  <main id="main-content">
    <div class="panel">
      <h1>Réclamer un code</h1>
      <p class="lead">
        Saisis le code distribue lors d'un événement de l'asso pour recevoir
        des boosters, ou parfois directement une carte précise.
      </p>

      <div id="guest-warning" style="display:none;">
        <p>Tu dois d'abord te <a href="index.html">connecter avec Discord</a>.</p>
      </div>

      <div id="redeem-zone" style="display:none;">
        <div class="redeem-card">
          <span class="redeem-icon" aria-hidden="true">&#127873;</span>
          <div class="code-form">
            <label for="code-input" class="sr-only">Code de l'événement</label>
            <input type="text" id="code-input" placeholder="CODE" maxlength="20" autocomplete="off" />
            <button id="redeem-btn" type="button">Réclamer</button>
          </div>
        </div>

        <div id="reward-zone"></div>
        <div id="reveal-grid" class="reveal-grid"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/redeem.js"></script>
</body>
</html>
