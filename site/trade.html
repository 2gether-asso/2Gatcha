<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Échanges - 2Gatcha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%238b5cf6%27/%3E%3Cstop offset=%271%27 stop-color=%27%2322d3ee%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27sans-serif%27 font-weight=%27800%27 font-size=%2730%27 fill=%27white%27 text-anchor=%27middle%27%3E2G%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <header id="site-header"></header>

  <main id="main-content">
    <div class="panel">
      <h1>Échanges</h1>
      <p class="lead">Propose l'échange d'une de tes cartes contre celle d'un autre joueur.</p>

      <div id="guest-warning" style="display:none;">
        <p>Tu dois d'abord te <a href="index.html">connecter avec Discord</a>.</p>
      </div>

      <div id="trade-zone" style="display:none;">
        <h2>Proposer un échange</h2>
        <form id="create-trade-form" class="trade-form">
          <label>
            Ma carte a offrir
            <div class="card-preview-row">
              <img id="offered-card-preview" class="card-preview-thumb" alt="" />
              <select id="offered-card-select" required></select>
            </div>
          </label>
          <label>
            Exemplaire a donner
            <select id="offered-pull-select" required></select>
          </label>
          <label>
            Pseudo du joueur cible
            <select id="target-select" required></select>
          </label>
          <label>
            Carte demandee (laisse sur "Aucune" pour un don)
            <div class="card-preview-row">
              <img id="requested-card-preview" class="card-preview-thumb" alt="" />
              <select id="requested-card-select"><option value="">Choisis d'abord un joueur cible</option></select>
            </div>
          </label>
          <button type="submit">Proposer l'échange</button>
        </form>

        <div id="trade-suggestions" class="panel" style="display:none;margin:20px 0;padding:16px;">
          <h2 style="font-size:1.05rem;">&#128161; Suggestions d'échange</h2>
          <div id="trade-suggestions-list" class="suggestions-list"></div>
        </div>

        <div class="tabs" role="tablist" style="margin-top:28px;">
          <button type="button" class="tab active" id="tab-incoming-btn" role="tab" aria-selected="true">Reçus <span class="tab-count" id="incoming-count"></span></button>
          <button type="button" class="tab" id="tab-outgoing-btn" role="tab" aria-selected="false">Envoyés <span class="tab-count" id="outgoing-count"></span></button>
        </div>

        <div class="actions" style="margin-top:16px;align-items:center;">
          <input type="text" id="trade-history-search" placeholder="Filtrer par pseudo..." autocomplete="off" style="flex:1;" aria-label="Filtrer les échanges par pseudo" />
          <button type="button" class="btn-ghost" id="bulk-cancel-toggle">Annulation groupée</button>
        </div>
        <div id="bulk-cancel-bar" class="bulk-action-bar" style="display:none;">
          <span id="bulk-cancel-summary"></span>
          <button type="button" class="btn-danger" id="bulk-cancel-btn">Annuler la sélection</button>
        </div>

        <div id="trades-loading" class="loading-row" style="display:none;"><div class="spinner"></div></div>
        <div id="incoming-pane"><div id="incoming-trades" class="trade-list"></div></div>
        <div id="outgoing-pane" style="display:none;"><div id="outgoing-trades" class="trade-list"></div></div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/trade.js"></script>
</body>
</html>
